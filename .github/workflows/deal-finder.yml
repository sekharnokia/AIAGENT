name: Kids clothing deal finder

on:
  push:
    branches: [main]
    paths:
      - 'src/deal-finder.mjs'
  schedule:
    # Eastern 9 AM and 6 PM: run at both possible UTC hours, then the script
    # gates execution to the correct America/New_York local hour (DST-safe).
    - cron: "0 13,14,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kids-clothing-deal-finder
  cancel-in-progress: false

jobs:
  find-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Run deal finder
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/deal-finder.mjs

      - name: Save sent-deal history
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add data/seen.json
            git commit -m "Update sent deal history"
            git push
          fi
